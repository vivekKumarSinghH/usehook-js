name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      # npm Trusted Publishing (OIDC) requires a recent npm CLI, newer than
      # what some runner images ship by default.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # If there are pending changesets, this opens/updates a "Version
      # Packages" PR instead of publishing. If there are none and the local
      # package.json version isn't on the registry yet (true today, for the
      # 1.0.0 first release), it runs the publish command directly.
      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
